[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-nav"
version = "0.1.0"
description = "Minimal Python framework for robot navigation algorithms"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
visualization = ["rerun-sdk==0.22.1"]
s100-l515 = [
    "numpy>=1.24,<2",
    "opencv-python-headless>=4.8,<4.12",
    "pyrealsense2==2.54.1.5217",
    "pyserial>=3.5",
]

[project.scripts]
robot-nav = "robot_nav.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
