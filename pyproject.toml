[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-nav"
version = "0.1.0"
description = "Minimal Python framework for robot navigation algorithms"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
visualization = ["rerun-sdk==0.22.1"]

[project.scripts]
robot-nav = "robot_nav.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
